name: MUTQAN Release ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax check
        run: |
          set -e
          find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Activation loader smoke test
        run: php tests/activation-smoke.php
      - name: Package plugin
        run: |
          set -e
          VERSION="$(php -r 'preg_match("/Version:\\s*([^\\r\\n]+)/", file_get_contents("mutqan.php"), $m); echo trim($m[1]);')"
          rm -rf build
          mkdir -p "build/mutqan"
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' --exclude='tests' --exclude='*.zip' ./ "build/mutqan/"
          cd build
          zip -qr "mutqan-unified-${VERSION}.zip" mutqan
      - uses: actions/upload-artifact@v4
        with:
          name: mutqan-unified-${{ github.sha }}
          path: build/mutqan-unified-*.zip
